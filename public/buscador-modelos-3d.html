<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Buscador 3D — El Shop de Ariana</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&family=Nunito:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --pink:#E8317A; --yellow:#F5C842; --green:#6DBF67;
    --purple:#9B6DB5; --orange:#F47C3C; --sky:#AEE0F5;
    --cream:#FFFDF8; --dark:#2B1704;
  }
  body { font-family:'Nunito',sans-serif; background:var(--cream); color:var(--dark); min-height:100vh; padding:1.5rem 1rem 4rem; }

  header { text-align:center; margin-bottom:1.8rem; }
  .logo { font-family:'Fredoka',sans-serif; font-size:1rem; font-weight:700; color:var(--pink); margin-bottom:0.3rem; }
  h1 { font-family:'Fredoka',sans-serif; font-size:clamp(1.7rem,5vw,2.4rem); font-weight:700; line-height:1.1; }
  h1 span { color:var(--pink); }
  .subtitle { margin-top:0.4rem; font-size:0.88rem; font-weight:600; color:rgba(43,23,4,0.45); }

  /* Search */
  .search-row { display:flex; gap:0.5rem; max-width:580px; margin:0 auto 1.2rem; }
  .search-row input {
    flex:1; font-family:'Nunito',sans-serif; font-size:1rem; font-weight:700;
    padding:0.85rem 1.2rem; border:3px solid var(--pink); border-radius:2rem;
    background:#fff; color:var(--dark); outline:none;
    box-shadow:0 4px 16px rgba(232,49,122,0.1); transition:box-shadow 0.2s;
  }
  .search-row input:focus { box-shadow:0 4px 20px rgba(232,49,122,0.22); }
  .search-row input::placeholder { color:rgba(43,23,4,0.3); font-weight:600; }
  .btn-search {
    font-family:'Nunito',sans-serif; font-weight:800; font-size:0.95rem;
    padding:0.85rem 1.6rem; background:var(--pink); color:#fff;
    border:none; border-radius:2rem; cursor:pointer;
    box-shadow:0 4px 14px rgba(232,49,122,0.3); transition:background 0.15s,transform 0.1s;
    white-space:nowrap;
  }
  .btn-search:hover { background:var(--orange); }
  .btn-search:active { transform:scale(0.97); }

  /* Quick filters */
  .filters { display:flex; flex-wrap:wrap; gap:0.4rem; justify-content:center; margin-bottom:1.5rem; }
  .chip {
    font-family:'Nunito',sans-serif; font-weight:700; font-size:0.75rem;
    padding:0.3rem 0.85rem; border-radius:99px; border:none; cursor:pointer;
    transition:transform 0.12s, opacity 0.12s; opacity:0.88;
  }
  .chip:hover { transform:scale(1.06); opacity:1; }

  /* Platform toggles */
  .platform-row {
    display:flex; flex-wrap:wrap; gap:0.5rem; justify-content:center;
    max-width:600px; margin:0 auto 0.8rem;
  }
  .ptoggle {
    font-family:'Nunito',sans-serif; font-weight:700; font-size:0.78rem;
    padding:0.35rem 0.9rem; border-radius:99px; cursor:pointer;
    border:2px solid; transition:all 0.15s; user-select:none;
  }
  .ptoggle.on { color:#fff; }
  .ptoggle.off { background:transparent !important; color:rgba(43,23,4,0.4) !important; border-color:rgba(43,23,4,0.15) !important; }

  /* Results panel */
  #results { max-width:600px; margin:1.5rem auto 0; display:none; }

  .results-header {
    display:flex; justify-content:space-between; align-items:center;
    margin-bottom:0.8rem;
  }
  .results-q {
    font-family:'Fredoka',sans-serif; font-size:1.1rem; font-weight:700;
  }
  .results-q span { color:var(--pink); }
  .btn-open-all {
    font-family:'Nunito',sans-serif; font-weight:800; font-size:0.8rem;
    padding:0.4rem 1rem; background:var(--dark); color:var(--cream);
    border:none; border-radius:99px; cursor:pointer; transition:background 0.15s;
  }
  .btn-open-all:hover { background:var(--pink); }

  .result-card {
    background:#fff; border-radius:1.2rem; padding:0.9rem 1.1rem;
    display:flex; align-items:center; gap:0.8rem;
    margin-bottom:0.55rem;
    border:2px solid transparent;
    box-shadow:0 2px 10px rgba(43,23,4,0.06);
    transition:transform 0.15s, border-color 0.15s, box-shadow 0.15s;
  }
  .result-card:hover { transform:translateX(4px); box-shadow:0 4px 18px rgba(43,23,4,0.1); }

  .rc-icon { font-size:1.6rem; flex-shrink:0; }
  .rc-info { flex:1; min-width:0; }
  .rc-name { font-weight:800; font-size:0.92rem; display:block; }
  .rc-tag { font-size:0.7rem; font-weight:700; padding:2px 7px; border-radius:99px; display:inline-block; margin-top:2px; }
  .rc-desc { font-size:0.75rem; font-weight:600; color:rgba(43,23,4,0.4); margin-top:1px; display:block; }

  .btn-open {
    font-family:'Nunito',sans-serif; font-weight:800; font-size:0.8rem;
    padding:0.5rem 1.1rem; border-radius:99px; border:none;
    cursor:pointer; white-space:nowrap; transition:all 0.15s;
    color:#fff; flex-shrink:0;
  }

  /* History */
  .history-wrap { max-width:600px; margin:1.5rem auto 0; }
  .history-title { font-size:0.7rem; font-weight:800; text-transform:uppercase; letter-spacing:.1em; color:rgba(43,23,4,0.3); margin-bottom:0.5rem; }
  .history-list { display:flex; flex-wrap:wrap; gap:0.35rem; }
  .hchip {
    background:#fff; border:1.5px solid rgba(43,23,4,0.1); border-radius:99px;
    padding:0.25rem 0.8rem; font-size:0.78rem; font-weight:700;
    cursor:pointer; color:rgba(43,23,4,0.5); transition:border-color 0.15s, color 0.15s;
    display:flex; align-items:center; gap:4px;
  }
  .hchip:hover { border-color:var(--pink); color:var(--pink); }
  .hchip .x { opacity:0.35; font-size:0.7rem; }
  .hchip:hover .x { opacity:0.8; }

  #toast {
    position:fixed; bottom:1.5rem; left:50%; transform:translateX(-50%) translateY(10px);
    background:var(--green); color:#fff; font-weight:800; font-size:0.85rem;
    padding:0.6rem 1.3rem; border-radius:99px; opacity:0;
    transition:opacity 0.2s, transform 0.2s; pointer-events:none; z-index:99; white-space:nowrap;
  }
  #toast.show { opacity:1; transform:translateX(-50%) translateY(0); }
</style>
</head>
<body>

<header>
  <p class="logo">✨ El Shop de Ariana</p>
  <h1>Buscador de <span>Modelos 3D</span> 🖨️</h1>
  <p class="subtitle">Seleccioná plataformas → buscá → abrí las que te interesen</p>
</header>

<div class="search-row">
  <input type="text" id="query" placeholder="Ej: organizador escritorio, bandeja, llavero...">
  <button class="btn-search" onclick="doSearch()">Buscar →</button>
</div>

<div class="filters" id="filter-chips"></div>
<div class="platform-row" id="platform-toggles"></div>

<div id="results">
  <div class="results-header">
    <span class="results-q" id="results-label"></span>
    <button class="btn-open-all" onclick="openAll()">Abrir todas 🚀</button>
  </div>
  <div id="result-list"></div>
</div>

<div class="history-wrap" id="history-wrap" style="display:none;">
  <p class="history-title">Búsquedas recientes</p>
  <div class="history-list" id="history-list"></div>
</div>

<div id="toast"></div>

<script>
const PLATFORMS = [
  { id:'makerworld', name:'MakerWorld', icon:'🐼', tag:'Bambu oficial', tagBg:'#AEE0F5', tagColor:'#2B1704', color:'#0ea5e9', desc:'Modelos optimizados para Bambu Lab', url:q=>`https://makerworld.com/en/search/models?keyword=${encodeURIComponent(q)}`, on:true },
  { id:'printables', name:'Printables', icon:'🟠', tag:'Prusa', tagBg:'#F47C3C', tagColor:'#fff', color:'#F47C3C', desc:'Gran comunidad, filtros avanzados', url:q=>`https://www.printables.com/search/models?q=${encodeURIComponent(q)}`, on:true },
  { id:'thingiverse', name:'Thingiverse', icon:'🌀', tag:'Clásico', tagBg:'#9B6DB5', tagColor:'#fff', color:'#9B6DB5', desc:'El catálogo más grande y antiguo', url:q=>`https://www.thingiverse.com/search?q=${encodeURIComponent(q)}&type=things`, on:true },
  { id:'cults3d', name:'Cults3D', icon:'🌸', tag:'Premium gratis', tagBg:'#E8317A', tagColor:'#fff', color:'#E8317A', desc:'Diseños artísticos y decorativos', url:q=>`https://cults3d.com/en/search#creations?q=${encodeURIComponent(q)}`, on:false },
  { id:'myminifactory', name:'MyMiniFactory', icon:'🏭', tag:'Curated', tagBg:'#6DBF67', tagColor:'#fff', color:'#6DBF67', desc:'Modelos verificados y testeados', url:q=>`https://www.myminifactory.com/search/#/?query=${encodeURIComponent(q)}`, on:false },
  { id:'thangs', name:'Thangs', icon:'🔷', tag:'IA search', tagBg:'#F5C842', tagColor:'#2B1704', color:'#F5C842', desc:'Búsqueda por similitud visual con IA', url:q=>`https://thangs.com/search/${encodeURIComponent(q)}?scope=all`, on:false },
];

const FILTERS = [
  { label:'🗂️ Organizadores', q:'desk organizer' },
  { label:'🌸 Decoración', q:'home decoration' },
  { label:'🎁 Regalos', q:'gift box' },
  { label:'🏠 Hogar', q:'home storage' },
  { label:'💄 Tocador', q:'bathroom organizer' },
  { label:'🪴 Maceta', q:'planter pot' },
  { label:'📦 Cajas', q:'storage box organizer' },
  { label:'🪞 Espejo', q:'mirror frame decor' },
];

const filterColors = ['#E8317A','#F47C3C','#9B6DB5','#6DBF67','#F5C842','#AEE0F5','#E8317A','#6DBF67'];
const filterText   = ['#fff','#fff','#fff','#fff','#2B1704','#2B1704','#fff','#fff'];

let history = JSON.parse(localStorage.getItem('search3d_h') || '[]');
let currentQ = '';

// Init toggles
function renderToggles() {
  document.getElementById('platform-toggles').innerHTML = PLATFORMS.map(p => `
    <button class="ptoggle ${p.on?'on':'off'}" id="tog-${p.id}"
      style="${p.on?`background:${p.color};border-color:${p.color};color:#fff;`:''}; "
      onclick="toggleP('${p.id}')">${p.icon} ${p.name}</button>
  `).join('');
}

function toggleP(id) {
  const p = PLATFORMS.find(x=>x.id===id);
  const active = PLATFORMS.filter(x=>x.on);
  if (p.on && active.length === 1) { toast('⚠️ Seleccioná al menos una'); return; }
  p.on = !p.on;
  const btn = document.getElementById('tog-'+id);
  if (p.on) {
    btn.classList.replace('off','on');
    btn.style.cssText = `background:${p.color};border-color:${p.color};color:#fff;`;
  } else {
    btn.classList.replace('on','off');
    btn.style.cssText = '';
  }
  if (currentQ) renderResults(currentQ);
}

function renderFilters() {
  document.getElementById('filter-chips').innerHTML = FILTERS.map((f,i)=>`
    <button class="chip" style="background:${filterColors[i]};color:${filterText[i]};" onclick="setQ('${f.q}')">${f.label}</button>
  `).join('');
}

function setQ(q) {
  document.getElementById('query').value = q;
  document.getElementById('query').focus();
}

function doSearch() {
  const q = document.getElementById('query').value.trim();
  if (!q) { toast('✏️ Escribe qué buscar'); return; }
  currentQ = q;
  addHistory(q);
  renderResults(q);
}

function renderResults(q) {
  const active = PLATFORMS.filter(p=>p.on);
  document.getElementById('results-label').innerHTML = `Resultados para: <span>"${q}"</span>`;
  document.getElementById('result-list').innerHTML = active.map(p=>`
    <div class="result-card" style="border-left:4px solid ${p.color};">
      <span class="rc-icon">${p.icon}</span>
      <div class="rc-info">
        <span class="rc-name">${p.name}</span>
        <span class="rc-tag" style="background:${p.tagBg};color:${p.tagColor};">${p.tag}</span>
        <span class="rc-desc">${p.desc}</span>
      </div>
      <button class="btn-open" style="background:${p.color};"
        onclick="openOne('${p.id}','${encodeURIComponent(q)}')">Abrir →</button>
    </div>
  `).join('');
  document.getElementById('results').style.display = 'block';
}

function openOne(id, encodedQ) {
  const p = PLATFORMS.find(x=>x.id===id);
  const q = decodeURIComponent(encodedQ);
  window.open(p.url(q), '_blank');
}

function openAll() {
  const active = PLATFORMS.filter(p=>p.on);
  if (!currentQ) { toast('✏️ Buscá algo primero'); return; }
  active.forEach((p,i) => setTimeout(()=>window.open(p.url(currentQ),'_blank'), i*200));
  toast(`🚀 Abriendo ${active.length} plataformas...`);
}

// History
function addHistory(q) {
  history = [q, ...history.filter(h=>h!==q)].slice(0,12);
  localStorage.setItem('search3d_h', JSON.stringify(history));
  renderHistory();
}

function renderHistory() {
  const wrap = document.getElementById('history-wrap');
  if (!history.length) { wrap.style.display='none'; return; }
  wrap.style.display = 'block';
  document.getElementById('history-list').innerHTML = history.map((h,i)=>`
    <span class="hchip" onclick="setQ('${h}')">
      ${h}
      <span class="x" onclick="delHistory(event,${i})">✕</span>
    </span>
  `).join('');
}

function delHistory(e,i) {
  e.stopPropagation();
  history.splice(i,1);
  localStorage.setItem('search3d_h',JSON.stringify(history));
  renderHistory();
}

let toastT;
function toast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toastT);
  toastT = setTimeout(()=>t.classList.remove('show'), 2400);
}

document.addEventListener('DOMContentLoaded', ()=>{
  renderToggles();
  renderFilters();
  renderHistory();
  document.getElementById('query').addEventListener('keydown', e=>{ if(e.key==='Enter') doSearch(); });
});
</script>
</body>
</html>
